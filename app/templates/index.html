
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">问卷管理系统</a>
        <nav>
            <a href="/">首页</a>
            <a href="/login">登录 / 注册</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <span class="tag">MongoDB · Flask</span>
            <h1>让问卷创建与数据收集更简单</h1>
            <p>创建问卷、分享链接、收集回答，并查看统计结果。</p>
            <div class="actions">
                <a class="button primary" href="/login">开始使用</a>
                <a class="button secondary" href="#features">了解功能</a>
            </div>
        </section>

        <section id="features" class="feature-grid">
            <article class="feature-card">
                <div class="feature-icon">01</div>
                <h2>创建问卷</h2>
                <p>创建问卷并添加不同类型的问题。</p>
                <a href="/create-survey">进入创建页面 →</a>
            </article>

            <article class="feature-card">
                <div class="feature-icon">02</div>
                <h2>填写问卷</h2>
                <p>通过问卷分享链接参与填写。</p>
                <a href="/fill-survey">进入填写页面 →</a>
            </article>

            <article class="feature-card">
                <div class="feature-icon">03</div>
                <h2>数据统计</h2>
                <p>查看问卷回答与统计结果。</p>
                <a href="/stats">查看统计页面 →</a>
            </article>
        </section>

        <section class="notice">
            <h2>系统简介</h2>
            <p>
                本系统基于 Flask 和 MongoDB 开发，
                支持问卷管理、题目配置、问卷提交与结果统计。
            </p>
        </section>
    </main>

    <footer class="footer">
        基于 MongoDB 的问卷系统开发 · 课程项目
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
